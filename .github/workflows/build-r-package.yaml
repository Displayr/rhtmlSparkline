name: Build rhtmlSparkline

on:
  workflow_dispatch:
  push:

jobs:
  build:
    name: Build rhtmlSparkline
    permissions:
      checks: write
      contents: read
    uses: Displayr/nixr-public/.github/workflows/build-flake-installable.yaml@master
    with:
      installable-path: pkgs.x86_64-linux.rPackages.rhtmlSparkline
      build-args: --override-input rhtmlSparkline .
      installable-name: rhtmlSparkline
    secrets: inherit
